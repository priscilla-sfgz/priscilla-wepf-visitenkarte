<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Bücher</title>
    <link rel="stylesheet" href="Uebung3.css">
</head>

<body>


    <main>
        <header class="head">
            <h1>Meine kleine Büchersammlung</h1>
            <p>von Priscilla Wepf</p>
        </header>
        <div class="gallery">
            <figure class="pic1">
                <img src="Bilder/bild-1.png" alt="Buch: Game Design Workshop">
                <figcaption>Game Design Workshop <br>
                    <span>von Tracy Fullerton </span>
                </figcaption>
            </figure>

            <figure class="pic2">
                <img src="Bilder/bild-2.png" alt="Buch: Bartimäus">
                <figcaption>Bartimäus<br>
                    <span>von Jonathan Stroud</span>
                </figcaption>
            </figure>

            <figure class="pic3">
                <img src="Bilder/bild-3.png" alt="Buch: Erst kommen, dann gehen.">
                <figcaption>Erst kommen, dann gehen.<br>
                    <span>von Henriette Hell</span>
                </figcaption>
            </figure>

            <figure class="pic4">
                <img src="Bilder/bild-4.png" alt="Buch: Highschool DxD">
                <figcaption>Highschool DxD<br>
                    <span>von Hiroji Mishima</span>
                </figcaption>
            </figure>

            <figure class="pic5">
                <img src="Bilder/bild-5.png" alt="Buch: Die Farben der Magie">
                <figcaption>Die Farben der Magie<br>
                    <span>von Terry Pratchett</span>
                </figcaption>
            </figure>

            <figure class="pic6">
                <img src="Bilder/bild-6.png" alt="Buch: Piranesi">
                <figcaption>Piranesi<br>
                    <span>von Susanna Clarke</span>
                </figcaption>
            </figure>

            <figure class="pic7">
                <img src="Bilder/bild-7.png" alt="Buch: Gay, straight and the reason why">
                <figcaption>Gay, straight and the reason why<br>
                    <span>von Simon Levay</span>
                </figcaption>
            </figure>

            <figure class="pic8">
                <img src="Bilder/bild-8.png" alt="Buch: Fundamentalismus">
                <figcaption>Fundamentalismus<br>
                    <span>von Wolfgang Wippermann</span>
                </figcaption>
            </figure>

            <figure class="pic9">
                <img src="Bilder/bild-9.png" alt="Buch: Becoming cliterate">
                <figcaption>Becoming cliterate<br>
                    <span>von Laurie Mintz Ph.D.</span>
                </figcaption>
            </figure>

            <figure class="pic10">
                <img src="Bilder/bild-10.png" alt="Buch: Welcher Stein ist das?">
                <figcaption>Welcher Stein ist das?<br>
                    <span>von Kosmos Naturführer</span>
                </figcaption>
            </figure>
        </div>
    </main>
</body>

</html>
